name: Build Firmware

'on':
  workflow_dispatch:
    inputs:
      target:
        description: 'PlatformIO Environment Target'
        required: false
        default: 'tx-diy-e28-2400-esp32'
        type: string
  push:
    branches:
      - 'main'
      - '**'
    paths:
      - 'mLRS/**'
      - 'esp/**'
      - 'platformio.ini'
      - '.github/workflows/**'

jobs:
  build:
    name: Build Firmware (${{ inputs.target || 'tx-diy-e28-2400-esp32' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install PlatformIO
        run: pip install -U platformio future

      - name: Generate MAVLink headers
        run: |
          cd mLRS/Common/mavlink
          python fmav_generate_c_library.py
          cd ../../..

      - name: Build TX firmware
        run: |
          pio run -e ${{ inputs.target || 'tx-diy-e28-2400-esp32' }}
          mkdir -p release
          TARGET="${{ inputs.target || 'tx-diy-e28-2400-esp32' }}"
          cp .pio/build/${TARGET}/firmware.bin release/tx-diy-e28-2400-esp32-v1.4.05.bin
          cp .pio/build/${TARGET}/firmware.bin release/${TARGET}-github-ci.bin
          cp .pio/build/${TARGET}/firmware.elf release/${TARGET}-github-ci.elf

      - name: Build Wireless Bridge firmware
        run: |
          cd esp/mlrs-wireless-bridge
          pio run -e esp8285
          cd ../..
          cp esp/mlrs-wireless-bridge/.pio/build/esp8285/firmware.bin release/mlrs-wireless-bridge-esp8266-no-at.bin
          gzip -c -9 release/mlrs-wireless-bridge-esp8266-no-at.bin > release/mlrs-wireless-bridge-esp8266-no-at.bin.gz

      - name: Upload TX firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mLRS-firmware-${{ inputs.target || 'tx-diy-e28-2400-esp32' }}
          path: |
            .pio/build/**/firmware.bin
            .pio/build/**/firmware.elf
            release/tx-diy-e28-2400-esp32-v1.4.05.bin
            release/*-github-ci.bin
            release/*-github-ci.elf

      - name: Upload Wireless Bridge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlrs-wireless-bridge-esp8266-no-at
          path: |
            release/mlrs-wireless-bridge-esp8266-no-at.bin
            release/mlrs-wireless-bridge-esp8266-no-at.bin.gz
